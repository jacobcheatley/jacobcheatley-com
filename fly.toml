app = "jacobcheatley-com"
primary_region = "syd"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"   # ponytail: prod → min_machines_running = 1 when a Project needs a persistent process
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
