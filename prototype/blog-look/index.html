<!doctype html>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "What do the Blog, an Article and the Cover look like?"
  Three variants (?variant=A|B|C) of four views (?view=listing|article|cover|not-found),
  optional ?scheme=light|dark. Run: python3 -m http.server 8115 in this folder.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog look prototype</title>
<style>
@font-face { font-family: "Newsreader Variable"; font-style: normal; font-weight: 200 800; src: url(fonts/newsreader-latin-wght-normal.woff2) format("woff2"); }
@font-face { font-family: "Newsreader Variable"; font-style: italic; font-weight: 200 800; src: url(fonts/newsreader-latin-wght-italic.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }

@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }

/* The site's tokens, copied from src/styles.css */
:root {
  color-scheme: light dark;
  --color-paper: light-dark(#f7f7f4, #1a1b1a);
  --color-ink: light-dark(#202523, #e8e9e6);
  --color-accent: light-dark(#28714a, #7dd69a);
  --color-accent-2: light-dark(#d96c1e, #f2a05a);
  --color-name: light-dark(#d63a2f, #f26b5e);
  --color-muted: light-dark(#626864, #9aa09c);
  --color-line: light-dark(#dcddd8, #2e302e);
  --color-surface: light-dark(#ffffff, #232524);
  --font-serif: "Newsreader Variable", Georgia, "Times New Roman", serif;
  --font-sans: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Shiki's CSS-variables theme, mapped onto the palette */
  --code-foreground: var(--color-ink);
  --code-background: var(--color-surface);
  --code-token-keyword: var(--color-accent);
  --code-token-function: var(--color-ink);
  --code-token-string: var(--color-accent-2);
  --code-token-string-expression: var(--color-accent-2);
  --code-token-constant: var(--color-accent-2);
  --code-token-parameter: var(--color-ink);
  --code-token-comment: var(--color-muted);
  --code-token-punctuation: var(--color-muted);
  --code-token-link: var(--color-accent);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-serif); font-size: 1.0625rem; line-height: 1.5; -webkit-font-smoothing: antialiased; padding-bottom: 6rem; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
.sans { font-family: var(--font-sans); }
.muted { color: var(--color-muted); }
.name { color: var(--color-name); font-style: italic; font-weight: 500; text-decoration: none; }
.name:hover { text-decoration: underline; }

/* ---------- Article body, shared by every variant ---------- */
.prose { font-size: 1.1875rem; line-height: 1.6; }
.prose p, .prose ul, .prose ol, .prose blockquote, .prose table, .prose pre, .prose aside, .prose figure { margin: 0 0 1.25em; }
.prose h2 { font-size: 1.5rem; font-weight: 600; line-height: 1.25; margin: 2.25em 0 0.6em; position: relative; }
.prose h3 { font-size: 1.1875rem; font-weight: 600; font-style: italic; margin: 1.75em 0 0.5em; position: relative; }
.prose a { color: var(--color-accent); text-underline-offset: 0.15em; }
.prose code { font-family: var(--font-mono); font-size: 0.85em; }
.prose :not(pre) > code { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: 2px; padding: 0.05em 0.3em; }
.prose pre { background: var(--color-surface) !important; border: 1px solid var(--color-line); border-radius: 2px; padding: 1rem 1.125rem; overflow-x: auto; line-height: 1.55; font-size: 0.9375rem; }
.prose pre code { font-size: 0.875rem; }
.prose blockquote { border-left: 2px solid var(--color-line); padding-left: 1.125rem; font-style: italic; color: var(--color-muted); }
.prose table { border-collapse: collapse; font-family: var(--font-sans); font-size: 0.9375rem; width: 100%; }
.prose th, .prose td { text-align: left; padding: 0.4rem 0.75rem 0.4rem 0; border-bottom: 1px solid var(--color-line); }
.prose th { font-weight: 600; }
.prose sup a { font-family: var(--font-sans); font-size: 0.75rem; text-decoration: none; padding: 0 0.1em; }
.prose .footnotes { margin-top: 3rem; border-top: 1px solid var(--color-line); padding-top: 1rem; font-size: 1rem; color: var(--color-muted); }
.prose .footnotes ol { padding-left: 1.25rem; margin: 0; }
.prose .mermaid-out { display: flex; justify-content: center; margin: 0 0 1.25em; }
.prose .mermaid-out svg { max-width: 100%; height: auto; }
.prose .callout-label { font-family: var(--font-sans); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent-2); margin: 0 0 0.25rem; }
.prose .callout > :last-child { margin-bottom: 0; }
.sidenote { display: none; }
.topics { font-family: var(--font-sans); }

/* ---------- Variant A: quiet column ---------- */
[data-variant="A"] .page { max-width: calc(var(--measure, 44rem) + 2rem); margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) 1rem 0; }
[data-variant="A"] .mast { display: flex; gap: 0.6rem; align-items: baseline; font-size: 1.25rem; margin-bottom: clamp(2.5rem, 6vw, 4rem); }
[data-variant="A"] .mast .here { font-style: italic; text-decoration: none; }
[data-variant="A"] .mast .here:hover { text-decoration: underline; }
[data-variant="A"] .rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 2.25rem; }
[data-variant="A"] .rows h2 { font-size: 1.5rem; font-weight: 500; line-height: 1.2; margin: 0 0 0.2rem; }
[data-variant="A"] .rows h2 a { text-decoration: none; }
[data-variant="A"] .rows h2 a:hover { color: var(--color-accent); text-decoration: underline; }
[data-variant="A"] .rows p { margin: 0; }
[data-variant="A"] .meta { font-family: var(--font-sans); font-size: 0.875rem; color: var(--color-muted); margin-top: 0.35rem !important; }
[data-variant="A"] .title { font-size: clamp(2rem, 5vw, 2.5rem); font-weight: 500; line-height: 1.1; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
[data-variant="A"] .tagline { font-size: 1.3125rem; font-style: italic; color: var(--color-muted); margin: 0; }
[data-variant="A"] .head { margin-bottom: 2.5rem; }
[data-variant="A"] .prose .anchor { position: absolute; left: -1.1em; text-decoration: none; color: var(--color-muted); opacity: 0; }
[data-variant="A"] .prose :is(h2, h3):hover .anchor, [data-variant="A"] .prose .anchor:focus { opacity: 1; }
[data-variant="A"] .prose .callout { border-left: 3px solid var(--color-accent-2); padding-left: 1.125rem; }
[data-variant="A"] .foot { margin-top: 4rem; border-top: 1px solid var(--color-line); padding-top: 1.5rem; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--color-muted); }

/* ---------- Variant B: margin column ---------- */
[data-variant="B"] .page { max-width: 53rem; margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) 1rem 0; }
[data-variant="B"] .main { margin-left: 13rem; max-width: 38rem; position: relative; }
[data-variant="B"] .in-margin { position: absolute; left: -13rem; width: 11rem; text-align: right; font-family: var(--font-sans); font-size: 0.8125rem; line-height: 1.45; color: var(--color-muted); }
[data-variant="B"] .mast { position: relative; margin-bottom: clamp(2.5rem, 6vw, 3.5rem); min-height: 2.25rem; }
[data-variant="B"] .mast .in-margin { top: 0.45rem; font-family: var(--font-serif); font-size: 1.0625rem; }
[data-variant="B"] .mast h1, [data-variant="B"] .mast .here { font-size: 1.75rem; font-style: italic; font-weight: 500; margin: 0; line-height: 1.2; text-decoration: none; display: block; }
[data-variant="B"] .year { position: relative; margin: 0 0 2.5rem; padding-top: 1.75rem; }
[data-variant="B"] .year > .in-margin { top: 0; font-weight: 600; font-size: 0.9375rem; color: var(--color-ink); }
[data-variant="B"] .rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 1.75rem; }
[data-variant="B"] .rows li { position: relative; }
[data-variant="B"] .rows li .in-margin { top: 0.35rem; }
[data-variant="B"] .rows h2 { font-size: 1.3125rem; font-weight: 500; line-height: 1.25; margin: 0; }
[data-variant="B"] .rows h2 a { text-decoration: none; }
[data-variant="B"] .rows h2 a:hover { color: var(--color-accent); text-decoration: underline; }
[data-variant="B"] .rows p { margin: 0.1rem 0 0; color: var(--color-muted); }
[data-variant="B"] .rows .topics { font-size: 0.8125rem; color: var(--color-accent); margin-top: 0.3rem; }
[data-variant="B"] .head { position: relative; margin-bottom: 2.25rem; }
[data-variant="B"] .head .in-margin { top: 0.6rem; }
[data-variant="B"] .head .in-margin .topics { color: var(--color-accent); display: block; margin-top: 0.25rem; }
[data-variant="B"] .title { font-size: clamp(1.875rem, 4.5vw, 2.25rem); font-weight: 500; line-height: 1.12; margin: 0 0 0.4rem; }
[data-variant="B"] .tagline { font-size: 1.25rem; font-style: italic; color: var(--color-muted); margin: 0; }
[data-variant="B"] .prose .anchor { position: absolute; left: -2rem; width: 1rem; text-align: right; text-decoration: none; color: var(--color-line); font-style: normal; font-weight: 400; }
[data-variant="B"] .prose :is(h2, h3):hover .anchor { color: var(--color-accent); }
[data-variant="B"] .prose .callout { position: relative; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: 2px; padding: 0.9rem 1.125rem; }
[data-variant="B"] .prose .callout-label { position: absolute; left: -13rem; width: 11rem; text-align: right; top: 1rem; }
[data-variant="B"] .sidenote { display: block; float: left; clear: left; margin-left: -13rem; width: 11rem; text-align: right; font-family: var(--font-sans); font-size: 0.8125rem; line-height: 1.45; color: var(--color-muted); font-style: normal; }
[data-variant="B"] .prose .footnotes { display: none; }
[data-variant="B"] .foot { margin: 4rem 0 0 13rem; max-width: 38rem; border-top: 1px solid var(--color-line); padding-top: 1.5rem; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--color-muted); }
@media (max-width: 56rem) {
  [data-variant="B"] .main, [data-variant="B"] .foot { margin-left: auto; margin-right: auto; }
  [data-variant="B"] .in-margin, [data-variant="B"] .prose .callout-label { position: static; width: auto; text-align: left; }
  [data-variant="B"] .prose .anchor { display: none; }
  [data-variant="B"] .sidenote { display: none; }
  [data-variant="B"] .prose .footnotes { display: block; }
}

/* ---------- Variant C: index + centred title block ---------- */
[data-variant="C"] .page { max-width: 58rem; margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) 1rem 0; }
[data-variant="C"] .mast { text-align: center; display: grid; gap: 0.35rem; margin-bottom: clamp(2.5rem, 6vw, 4rem); }
[data-variant="C"] .mast .name { font-size: 1.75rem; line-height: 1; }
[data-variant="C"] .mast .here { font-family: var(--font-sans); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-muted); text-decoration: none; }
[data-variant="C"] .mast .here:hover { color: var(--color-accent); }
[data-variant="C"] .rows { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--color-line); }
[data-variant="C"] .rows li { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 0 1.25rem; align-items: baseline; padding: 0.95rem 0; border-bottom: 1px solid var(--color-line); }
[data-variant="C"] .rows .date { font-family: var(--font-sans); font-size: 0.875rem; color: var(--color-muted); }
[data-variant="C"] .rows h2 { font-size: 1.25rem; font-weight: 500; line-height: 1.25; margin: 0; }
[data-variant="C"] .rows h2 a { text-decoration: none; }
[data-variant="C"] .rows li:hover h2 a { color: var(--color-accent); }
[data-variant="C"] .rows p { margin: 0.1rem 0 0; font-style: italic; color: var(--color-muted); font-size: 1rem; }
[data-variant="C"] .pill { font-family: var(--font-sans); font-size: 0.75rem; border: 1px solid var(--color-line); border-radius: 999px; padding: 0.1rem 0.55rem; color: var(--color-muted); margin-left: 0.3rem; white-space: nowrap; }
[data-variant="C"] .head { text-align: center; max-width: 46rem; margin: 0 auto 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--color-line); }
[data-variant="C"] .title { font-size: clamp(2.25rem, 6vw, 3.25rem); font-style: italic; font-weight: 500; line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 0.75rem; }
[data-variant="C"] .tagline { font-size: 1.3125rem; color: var(--color-muted); margin: 0 0 1rem; }
[data-variant="C"] .head .meta { font-family: var(--font-sans); font-size: 0.875rem; color: var(--color-muted); }
[data-variant="C"] .prose > * { max-width: 38rem; margin-left: auto; margin-right: auto; }
[data-variant="C"] .prose > :is(pre, .mermaid-out, table) { max-width: 50rem; }
[data-variant="C"] .prose .callout { max-width: 50rem; background: color-mix(in srgb, var(--color-accent-2) 12%, transparent); padding: 1.25rem 6rem; border-radius: 2px; }
@media (max-width: 40rem) { [data-variant="C"] .prose .callout { padding: 1rem; } }
[data-variant="C"] .prose .anchor { color: inherit; text-decoration: none; }
[data-variant="C"] .prose .anchor:hover { text-decoration: underline; text-decoration-color: var(--color-accent); }
[data-variant="C"] .foot { display: flex; justify-content: center; gap: 1.5rem; margin-top: 4rem; border-top: 1px solid var(--color-line); padding-top: 2rem; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--color-muted); }
@media (max-width: 40rem) {
  [data-variant="C"] .rows li { grid-template-columns: 1fr; }
  [data-variant="C"] .rows .pills { margin-top: 0.35rem; }
  [data-variant="C"] .pill { margin: 0 0.3rem 0 0; }
}
.foot a { text-decoration: none; }
.foot a:hover { color: var(--color-accent); text-decoration: underline; }

/* ---------- 404 ---------- */
.lost h1 { font-weight: 500; font-style: italic; font-size: 2rem; margin: 0 0 0.5rem; }
.lost p { margin: 0; }
.lost a { color: var(--color-accent); }
[data-variant="C"] .lost { text-align: center; }
[data-variant="C"] .lost .big { font-size: clamp(5rem, 16vw, 9rem); line-height: 1; font-style: italic; color: var(--color-line); }

/* ---------- Cover view: the real Portfolio shell ---------- */
.portfolio { max-width: 58rem; margin: 0 auto; display: grid; gap: clamp(2.5rem, 5vw, 4rem); padding: clamp(3rem, 8vw, 6rem) 1rem 4rem; }
.portfolio header { display: grid; gap: 0.5rem; text-align: center; }
.portfolio header h1 { font-size: clamp(2.75rem, 7vw, 4.5rem); font-weight: 500; font-style: italic; line-height: 1; letter-spacing: -0.01em; color: var(--color-name); margin: 0; }
.portfolio header p { font-size: 1.25rem; color: var(--color-muted); margin: 0; }
.covers { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.5rem 1.25rem; }
.covers a { display: block; position: relative; aspect-ratio: 3 / 2; }
.frame { position: absolute; inset: 0; overflow: hidden; border-radius: 2px; border: 1px solid var(--color-line); transition: 0.2s; container-type: size; }
.covers a:hover .frame { translate: 0 -2px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
.cork { width: 100%; height: 100%; background: #b98a57; position: relative; }
.cork i { position: absolute; aspect-ratio: 1; height: 70%; background: #f6e27a; box-shadow: 0 2px 6px rgb(0 0 0 / 0.3); }
.cover-A { width: 100%; height: 100%; background: #28714a; color: #f7f7f4; display: flex; align-items: flex-end; padding: 0 7cqw; font-style: italic; font-weight: 500; font-size: 46cqh; line-height: 0.95; letter-spacing: -0.02em; }
.cover-B { width: 100%; height: 100%; background: #ffffff; color: #202523; padding: 11cqh 12cqw 0; }
.cover-B b { display: block; font-style: italic; font-weight: 500; font-size: 17cqh; line-height: 1; margin-bottom: 6cqh; }
.cover-B i { display: block; height: 2.6cqh; margin-bottom: 3.4cqh; background: #dcddd8; border-radius: 1px; }
.cover-B i.call { height: 13cqh; background: none; border-left: 1.2cqw solid #d96c1e; margin-left: 0; box-shadow: inset 60cqw 0 0 #f3e3d6; width: 78%; }
.cover-B i.code { height: 16cqh; background: #f1f4f1; border: 1px solid #dcddd8; }
.cover-C { width: 100%; height: 100%; background: #d96c1e; color: #202523; position: relative; }
.cover-C .pilcrow { position: absolute; right: -4cqw; top: -22cqh; font-size: 135cqh; line-height: 1; color: #b9540f; font-weight: 600; }
.cover-C .word { position: absolute; left: 7cqw; bottom: 7cqh; font-style: italic; font-weight: 600; font-size: 30cqh; line-height: 1; }
.portfolio .foot { margin: 0; max-width: none; display: flex; justify-content: center; border-top: 1px solid var(--color-line); padding-top: 2rem; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--color-muted); }

/* ---------- Prototype switcher, not part of the design ---------- */
.proto-bar { position: fixed; bottom: 1rem; left: 50%; translate: -50% 0; display: flex; gap: 0.25rem; align-items: center; background: #111; color: #fff; font: 13px/1 system-ui, sans-serif; padding: 0.4rem; border-radius: 999px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.35); z-index: 10; white-space: nowrap; max-width: calc(100vw - 1rem); overflow-x: auto; }
.proto-bar button { all: unset; cursor: pointer; padding: 0.45rem 0.7rem; border-radius: 999px; }
.proto-bar button:hover { background: #333; }
.proto-bar button[aria-pressed="true"] { background: #fff; color: #111; }
.proto-bar .label { padding: 0 0.5rem; min-width: 10.5rem; text-align: center; font-weight: 600; }
.proto-bar .sep { width: 1px; height: 1.25rem; background: #444; margin: 0 0.25rem; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="proto-bar" id="bar" aria-label="Prototype switcher"></nav>

<script type="module">
const VARIANTS = { A: "Quiet column", B: "Margin column", C: "Index + title block" };
const VIEWS = { listing: "Listing", article: "Article", cover: "Cover", "not-found": "404" };
const SCHEMES = ["auto", "light", "dark"];
const MEASURES = ["36", "38", "40", "42", "44"];

const params = new URLSearchParams(location.search);
const variant = params.get("variant") in VARIANTS ? params.get("variant") : "A";
const view = params.get("view") in VIEWS ? params.get("view") : "listing";
const scheme = SCHEMES.includes(params.get("scheme")) ? params.get("scheme") : "auto";
const measure = MEASURES.includes(params.get("measure")) ? params.get("measure") : "44";
document.body.style.setProperty("--measure", measure + "rem");
document.body.dataset.variant = variant;
if (scheme !== "auto") document.documentElement.style.colorScheme = scheme;

const go = (next) => { location.search = new URLSearchParams({ variant, view, scheme, measure, ...next }); };

const ARTICLES = [
  { slug: "one-scalable-picture", title: "Every Note is one scalable picture", tagline: "Why the wall draws its Notes as SVG.", date: "2026-09-14", topics: ["svg", "react"] },
  { slug: "no-build-step", title: "A blog with no build step", tagline: "Markdown in a database row, rendered per request.", date: "2026-09-02", topics: ["markdown", "tanstack"] },
  { slug: "typescript-from-python", title: "Learning TypeScript from Python", tagline: "What carried over, and what did not.", date: "2026-08-18", topics: ["typescript", "python"] },
  { slug: "fly-on-a-budget", title: "Fly on a budget", tagline: "One small machine and a Postgres that sleeps.", date: "2025-11-30", topics: ["fly", "postgres"] },
];
const fmt = (iso, opts) => new Intl.DateTimeFormat("en-NZ", opts).format(new Date(iso));
const longDate = (iso) => fmt(iso, { day: "numeric", month: "long", year: "numeric" });
const shortDate = (iso) => fmt(iso, { day: "numeric", month: "short" });
const articleHref = "?" + new URLSearchParams({ variant, view: "article", scheme, measure });
const listingHref = "?" + new URLSearchParams({ variant, view: "listing", scheme, measure });
const portfolioHref = "?" + new URLSearchParams({ variant, view: "cover", scheme, measure });

/* rehype-autolink-headings can append (A), prepend (B) or wrap (C) */
function heading(level, id, text) {
  const tag = "h" + level;
  if (variant === "A") return `<${tag} id="${id}">${text}<a class="anchor" href="#${id}" aria-label="Link to this heading">#</a></${tag}>`;
  if (variant === "B") return `<${tag} id="${id}"><a class="anchor" href="#${id}" aria-label="Link to this heading">§</a>${text}</${tag}>`;
  return `<${tag} id="${id}"><a class="anchor" href="#${id}">${text}</a></${tag}>`;
}

const CODE = `// Only Published Articles leave the server.
export async function findPublishedArticle(slug: string, now: Date) {
  const [article] = await db
    .select()
    .from(articles)
    .where(and(eq(articles.slug, slug), lte(articles.publishDate, now)));
  return article ?? null;
}`;
const MERMAID = `flowchart LR
  D[Draft] -->|set a Publish date| S[Scheduled]
  S -->|the date passes| P[Published]
  P -->|clear the date| D`;

const body = () => `
<p>An Article is a row: a title, a Tagline, some Markdown and a Publish date. Nothing is built when one is published. The page is rendered from the row on every request<sup><a href="#fn-1" id="fnref-1" data-fn="1">1</a></sup>, which keeps the moving parts to a minimum.</p>
<p>This paragraph is here to judge the measure. A comfortable line holds somewhere between sixty and seventy-five characters, and the column should feel like a page of a book rather than a web app, with <code>inline code</code> and <a href="#">a link</a> sitting quietly in the text.</p>
${heading(2, "visibility", "Visibility is one comparison")}
<p>Draft, Scheduled and Published are not stored. They fall out of the Publish date, and the rule lives in the query.</p>
<pre data-lang="ts"><code></code></pre>
<aside class="callout" data-kind="warning"><p class="callout-label">Warning</p><p>The editor points at the production database. Saving is publishing, if the Publish date has passed.</p></aside>
${heading(2, "states", "Three states, no status column")}
<pre class="mermaid-src"></pre>
<p>A Scheduled Article appears on the first request after its date<sup><a href="#fn-2" id="fnref-2" data-fn="2">2</a></sup>. There is no job that flips it.</p>
${heading(3, "rules", "The whole rule")}
<table><thead><tr><th>Publish date</th><th>State</th><th>Visible</th></tr></thead><tbody><tr><td>none</td><td>Draft</td><td>no</td></tr><tr><td>in the future</td><td>Scheduled</td><td>no</td></tr><tr><td>in the past</td><td>Published</td><td>yes</td></tr></tbody></table>
<blockquote><p>The best code is the code that is not there.</p></blockquote>
<ul><li>No cache to invalidate.</li><li>No rendered HTML to go stale.</li><li>No release to publish.</li></ul>
<section class="footnotes"><ol>
<li id="fn-1">Server-side for the first load, then again in the browser when navigating from the listing. <a href="#fnref-1" aria-label="Back to reference 1">↩</a></li>
<li id="fn-2">Dates are entered and shown in Pacific/Auckland. <a href="#fnref-2" aria-label="Back to reference 2">↩</a></li>
</ol></section>`;

/* ---------- mastheads: what heads the Blog pages, and the way back ---------- */
function mast(onListing) {
  if (variant === "A") return `<nav class="mast"><a class="name" href="${portfolioHref}">Jacob Cheatley</a><span class="muted">/</span>${onListing ? `<h1 class="here" style="font:inherit;font-style:italic;margin:0">Blog</h1>` : `<a class="here" href="${listingHref}">Blog</a>`}</nav>`;
  if (variant === "B") return `<div class="main"><nav class="mast"><a class="in-margin name" href="${portfolioHref}">Jacob Cheatley</a>${onListing ? `<h1>Blog</h1>` : `<a class="here" href="${listingHref}">Blog</a>`}</nav></div>`;
  return `<nav class="mast"><a class="name" href="${portfolioHref}">Jacob Cheatley</a>${onListing ? `<h1 class="here" style="margin:0">Blog</h1>` : `<a class="here" href="${listingHref}">Blog</a>`}</nav>`;
}
const foot = () => variant === "C"
  ? `<footer class="foot"><a href="${listingHref}">All Articles</a><a href="https://github.com/jacobcheatley">GitHub</a></footer>`
  : `<footer class="foot"><a href="${listingHref}">← All Articles</a></footer>`;

/* ---------- views ---------- */
function listing() {
  if (variant === "A") return `<div class="page">${mast(true)}<ul class="rows">${ARTICLES.map((a) => `
    <li><h2><a href="${articleHref}">${a.title}</a></h2><p>${a.tagline}</p><p class="meta">${longDate(a.date)} · ${a.topics.join(", ")}</p></li>`).join("")}</ul></div>`;
  if (variant === "B") {
    const years = Object.groupBy(ARTICLES, (a) => a.date.slice(0, 4));
    return `<div class="page">${mast(true)}<div class="main">${Object.keys(years).sort().reverse().map((y) => `
      <section class="year"><div class="in-margin">${y}</div><ul class="rows">${years[y].map((a) => `
        <li><div class="in-margin">${shortDate(a.date)}</div><h2><a href="${articleHref}">${a.title}</a></h2><p>${a.tagline}</p><div class="topics">${a.topics.join(" · ")}</div></li>`).join("")}</ul></section>`).join("")}</div></div>`;
  }
  return `<div class="page">${mast(true)}<ul class="rows">${ARTICLES.map((a) => `
    <li><span class="date">${fmt(a.date, { day: "numeric", month: "short", year: "numeric" })}</span><div><h2><a href="${articleHref}">${a.title}</a></h2><p>${a.tagline}</p></div><span class="pills">${a.topics.map((t) => `<span class="pill">${t}</span>`).join("")}</span></li>`).join("")}</ul>
    <footer class="foot"><a href="https://github.com/jacobcheatley">GitHub</a></footer></div>`;
}

function article() {
  const a = ARTICLES[1];
  if (variant === "A") return `<div class="page">${mast(false)}<article><header class="head"><h1 class="title">${a.title}</h1><p class="tagline">${a.tagline}</p><p class="meta">${longDate(a.date)} · ${a.topics.join(", ")}</p></header><div class="prose">${body()}</div></article>${foot()}</div>`;
  if (variant === "B") return `<div class="page">${mast(false)}<article class="main"><header class="head"><div class="in-margin">${longDate(a.date)}<span class="topics">${a.topics.join(" · ")}</span></div><h1 class="title">${a.title}</h1><p class="tagline">${a.tagline}</p></header><div class="prose">${body()}</div></article>${foot()}</div>`;
  return `<div class="page">${mast(false)}<article><header class="head"><h1 class="title">${a.title}</h1><p class="tagline">${a.tagline}</p><div class="meta">${longDate(a.date)} · ${a.topics.join(" · ")}</div></header><div class="prose">${body()}</div></article>${foot()}</div>`;
}

function notFound() {
  const links = `<p><a href="${listingHref}">All Articles</a></p>`;
  if (variant === "A") return `<div class="page">${mast(false)}<div class="lost"><h1>No Article here.</h1>${links}</div></div>`;
  if (variant === "B") return `<div class="page">${mast(false)}<div class="main lost" style="position:relative"><div class="in-margin" style="top:0.7rem">404</div><h1>No Article here.</h1>${links}</div></div>`;
  return `<div class="page">${mast(false)}<div class="lost"><div class="big">404</div><h1>No Article here.</h1>${links}</div></div>`;
}

function cover() {
  const art = {
    B: `<div class="cover-B"><b>Blog</b><i></i><i style="width:92%"></i><i style="width:60%"></i><i class="call"></i><i class="code"></i></div>`,
    C: `<div class="cover-C"><span class="pilcrow">¶</span><span class="word">Blog</span></div>`,
  }[variant === "C" ? "C" : "B"];
  return `<main class="portfolio"><header><h1>Jacob Cheatley</h1><p>Games, puzzles and other small projects.</p></header>
    <ul class="covers">
      <li><a href="#" aria-label="Sticky Notes"><div class="frame"><div class="cork"><i style="left:-22%;top:-8%;rotate:-6deg"></i><i style="right:-22%;bottom:-10%;rotate:5deg;background:#f4a9c0"></i><i style="left:50%;top:50%;translate:-50% -50%;height:85%;rotate:2deg;background:#a8dcf0"></i></div></div></a></li>
      <li><a href="${listingHref}" aria-label="Blog"><div class="frame">${art}</div></a></li>
    </ul>
    <footer class="foot"><a href="https://github.com/jacobcheatley">GitHub</a></footer></main>`;
}

document.getElementById("app").innerHTML = { listing, article, cover, "not-found": notFound }[view]();

/* ---------- switcher ---------- */
const keys = Object.keys(VARIANTS);
const step = (d) => go({ variant: keys[(keys.indexOf(variant) + d + keys.length) % keys.length] });
const bar = document.getElementById("bar");
bar.innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button data-view="${k}" aria-pressed="${k === view}">${v}</button>`).join("")
  + `<span class="sep"></span><button data-step="-1" aria-label="Previous variant">←</button><span class="label">${variant} — ${VARIANTS[variant]}</span><button data-step="1" aria-label="Next variant">→</button>`
  + `<span class="sep"></span><button data-scheme>${scheme}</button>`
  + (variant === "A" ? `<button data-measure>${measure}rem</button>` : "");
bar.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.view) go({ view: b.dataset.view });
  else if (b.dataset.step) step(Number(b.dataset.step));
  else if ("measure" in b.dataset) go({ measure: MEASURES[(MEASURES.indexOf(measure) + 1) % MEASURES.length] });
  else go({ scheme: SCHEMES[(SCHEMES.indexOf(scheme) + 1) % SCHEMES.length] });
});
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ---------- Article extensions, the real libraries from a CDN ---------- */
if (view === "article") {
  // Variant B only shows them: footnotes repeated beside their reference
  for (const ref of document.querySelectorAll("sup a[data-fn]")) {
    const note = document.getElementById("fn-" + ref.dataset.fn).cloneNode(true);
    note.querySelector("a[aria-label]").remove();
    ref.parentElement.insertAdjacentHTML("afterend", `<span class="sidenote"><b>${ref.dataset.fn}</b> ${note.innerHTML}</span>`);
  }

  const codeEl = document.querySelector("pre[data-lang] code");
  codeEl.textContent = CODE;
  import("https://esm.sh/shiki").then(async ({ createHighlighter, createCssVariablesTheme }) => {
    const theme = createCssVariablesTheme({ name: "css-variables", variablePrefix: "--code-", fontStyle: true });
    const highlighter = await createHighlighter({ themes: [theme], langs: ["ts"] });
    codeEl.parentElement.outerHTML = highlighter.codeToHtml(CODE, { lang: "ts", theme: "css-variables" });
  }).catch((error) => console.error("shiki failed, code stays plain", error));

  const srcEl = document.querySelector(".mermaid-src");
  srcEl.textContent = MERMAID;
  // mermaid takes hex only, so resolve each light-dark() token through a probe element
  const probe = document.body.appendChild(document.createElement("span"));
  const hex = (token) => {
    probe.style.color = `var(${token})`;
    const [r, g, b] = getComputedStyle(probe).color.match(/\d+/g).map(Number);
    return "#" + [r, g, b].map((n) => n.toString(16).padStart(2, "0")).join("");
  };
  import("https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs").then(async ({ default: mermaid }) => {
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        fontFamily: '"IBM Plex Sans", system-ui, sans-serif',
        fontSize: "15px",
        background: hex("--color-paper"),
        primaryColor: hex("--color-surface"),
        primaryTextColor: hex("--color-ink"),
        primaryBorderColor: hex("--color-accent"),
        lineColor: hex("--color-muted"),
        secondaryColor: hex("--color-paper"),
        tertiaryColor: hex("--color-paper"),
        edgeLabelBackground: hex("--color-paper"),
      },
    });
    // mermaid sizes its labels by measuring text, so the face must be loaded first
    await document.fonts.load('15px "IBM Plex Sans"');
    const { svg } = await mermaid.render("diagram-1", MERMAID);
    srcEl.outerHTML = `<div class="mermaid-out">${svg}</div>`;
  }).catch((error) => console.error("mermaid failed, source stays", error));
}
</script>
</body>
</html>
