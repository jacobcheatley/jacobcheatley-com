<script type="text/markdown" id="sample-body">
An Article is a row: a title, a Tagline, some Markdown and a Publish date. Nothing is built when one is published. The page is rendered from the row on every request[^1], which keeps the moving parts to a minimum.

Standup is at 10:30 and the screenshots are 16:9. Neither of those is a directive, and both must survive.

## Visibility is one comparison

Draft, Scheduled and Published are not stored. They fall out of the Publish date, and the rule lives in the query.

```ts
// Only Published Articles leave the server.
export async function findPublishedArticle(slug: string, now: Date) {
  const [article] = await db
    .select()
    .from(articles)
    .where(and(eq(articles.slug, slug), lte(articles.publishedAt, now)));
  return article ?? null;
}
```

:::callout{kind="warning"}
The editor points at the production database. Saving is publishing, if the Publish date has passed.
:::

## Three states, no status column

```mermaid
flowchart LR
  D[Draft] -->|set a Publish date| S[Scheduled]
  S -->|the date passes| P[Published]
  P -->|clear the date| D
```

A Scheduled Article appears on the first request after its date[^2]. There is no job that flips it.

### The whole rule

| Publish date  | State     | Visible |
| ------------- | --------- | ------- |
| none          | Draft     | no      |
| in the future | Scheduled | no      |
| in the past   | Published | yes     |

## The same rule, from the Python I would have written

Coming from Python, the derived state reads the same. Indentation inside a fence is where a plain textarea hurts most, so try adding a branch here.

```python
from datetime import datetime


def status_of(publish_date: datetime | None, now: datetime) -> str:
    if publish_date is None:
        return "Draft"
    if publish_date > now:
        return "Scheduled"
    return "Published"
```

And the table behind it:

```sql
create table articles (
  id integer generated always as identity primary key,
  slug varchar(80) not null unique,
  title varchar(120) not null,
  tagline varchar(160) not null,
  body text not null,
  published_at timestamptz
);
```

> The best code is the code that is not there.

- No cache to invalidate.
- No rendered HTML to go stale.
- No release to publish.

The renderer is one React component, so the preview beside the source is the page itself:

```tsx
export function ArticleView({ article }: { article: Article }) {
  return (
    <article>
      <h1>{article.title}</h1>
      <p className="tagline">{article.tagline}</p>
      <ArticleBody markdown={article.body} />
    </article>
  );
}
```

[^1]: Server-side for the first load, then again in the browser when navigating from the listing.
[^2]: Dates are entered in the browser's zone and shown in Pacific/Auckland.
</script>

    ["Drafts", (by.Draft ?? []).sort((a, b) => b.id - a.id)],
    ["Scheduled", (by.Scheduled ?? []).sort((a, b) => a.publishAt.localeCompare(b.publishAt))],
    ["Published", (by.Published ?? []).sort((a, b) => b.publishAt.localeCompare(a.publishAt))],
  ].filter(([, articles]) => articles.length > 0);
}

/** The existing spelling of a Topic wins, as the save will do in the database. */
function normaliseTopics(names) {
  const topics = [];
  for (const raw of names) {
    const name = raw.trim().slice(0, 30);
    if (!name) continue;
    const spelling = allTopics().find((t) => t.toLowerCase() === name.toLowerCase()) ?? name;
    if (!topics.some((t) => t.toLowerCase() === spelling.toLowerCase())) topics.push(spelling);
  }
  return topics;
}

function createArticle({ title, slug, tagline }) {
  if (!SLUG_PATTERN.test(slug)) return { ok: false, reason: "slugInvalid" };
  if (store.articles.some((a) => a.slug === slug)) return { ok: false, reason: "slugTaken" };
  const article = { ...blankDraft(), id: store.nextId++, title, slug, tagline };
  store.articles.push(article);
  return { ok: true, article };
}
const SLUG_PROBLEMS = { slugInvalid: "Lowercase letters, digits and single hyphens only.", slugTaken: "Another Article already has this slug." };

let problem = "";
function save() {
  const draft = store.draft;
  if (!draft) return;
  draft.title = draft.title.trim();
  draft.tagline = draft.tagline.trim();
  problem = !draft.title ? "A title is required." : !draft.tagline ? "A Tagline is required." : "";
  if (!problem && !SLUG_PATTERN.test(draft.slug)) problem = SLUG_PROBLEMS.slugInvalid;
  if (!problem && store.articles.some((a) => a.slug === draft.slug && a.id !== draft.id)) problem = SLUG_PROBLEMS.slugTaken;
  if (!problem && draft.id === null) {
    const result = createArticle(draft);
    if (result.ok) draft.id = result.article.id;
    else problem = SLUG_PROBLEMS[result.reason];
  }
  if (problem) return refresh();
  draft.topics = normaliseTopics(draft.topics).sort((a, b) => a.localeCompare(b));
  store.articles[store.articles.findIndex((a) => a.id === draft.id)] = structuredClone(draft);
  persist();
  if (variant === "C") return renderShell();
  refresh();
}

function open(id) {
  if (isDirty() && !confirm("Discard unsaved changes?")) return refresh();
  store.draft = structuredClone(store.articles.find((a) => a.id === id));
  store.isListShown = false;
  problem = "";
  renderShell();
}

/* ---------- the renderer: remark/rehype as decided, minus React ---------- */
function registeredDirectives() {
  return (tree, file) => {
    const source = String(file);
    const walk = (parent) => {
      parent.children = parent.children.map((node) => {
        if (!node.type.endsWith("Directive")) {
          if (node.children) walk(node);
          return node;
        }
        if (node.type === "containerDirective" && node.name === "callout") {
          walk(node);
          const kind = node.attributes?.kind ?? "note";
          node.data = { hName: "aside", hProperties: { className: ["callout"], dataKind: kind } };
          node.children.unshift({ type: "paragraph", data: { hProperties: { className: ["callout-label"] } }, children: [{ type: "text", value: kind }] });
          return node;
        }
        // remark-directive reads prose such as 10:30 as a directive; an unregistered one goes back to its source text
        const text = { type: "text", value: source.slice(node.position.start.offset, node.position.end.offset) };
        return node.type === "textDirective" ? text : { type: "paragraph", children: [text] };
      });
    };
    walk(tree);
  };
}
function sourceLines() {
  return (tree) => {
    for (const node of tree.children) {
      if (node.type !== "element" || !node.position) continue;
      node.properties.dataLine = node.position.start.line;
      node.properties.dataLineEnd = node.position.end.line;
    }
  };
}
const processor = unified()
  .use(remarkParse).use(remarkGfm).use(remarkDirective).use(registeredDirectives)
  .use(remarkRehype).use(rehypeSlug)
  .use(rehypeAutolinkHeadings, { behavior: "append", properties: { className: ["anchor"], ariaLabel: "Link to this heading" }, content: { type: "text", value: "#" } })
  .use(sourceLines).use(rehypeStringify);

const shiki = import("https://esm.sh/shiki").then(async ({ createHighlighter, createCssVariablesTheme, bundledLanguages }) => {
  const theme = createCssVariablesTheme({ name: "css-variables", variablePrefix: "--code-", fontStyle: true });
  return { highlighter: await createHighlighter({ themes: [theme], langs: [] }), bundledLanguages };
});
async function highlight(lang, code) {
  const { highlighter, bundledLanguages } = await shiki;
  if (!(lang in bundledLanguages)) return null;
  await highlighter.loadLanguage(lang);
  return highlighter.codeToHtml(code, { lang, theme: "css-variables" });
}

const mermaidReady = import("https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs").then(async ({ default: mermaid }) => {
  // mermaid takes hex only, so resolve each light-dark() token through a probe element
  const probe = document.body.appendChild(document.createElement("span"));
  const hex = (token) => {
    probe.style.color = `var(${token})`;
    const [r, g, b] = getComputedStyle(probe).color.match(/\d+/g).map(Number);
    return "#" + [r, g, b].map((n) => n.toString(16).padStart(2, "0")).join("");
  };
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    themeVariables: {
      fontFamily: '"IBM Plex Sans", system-ui, sans-serif', fontSize: "15px",
      background: hex("--color-paper"), primaryColor: hex("--color-surface"), primaryTextColor: hex("--color-ink"),
      primaryBorderColor: hex("--color-accent"), lineColor: hex("--color-muted"),
      secondaryColor: hex("--color-paper"), tertiaryColor: hex("--color-paper"), edgeLabelBackground: hex("--color-paper"),
    },
  });
  // mermaid sizes its labels by measuring text, so the face must be loaded first
  await document.fonts.load('15px "IBM Plex Sans"');
  return mermaid;
});
let diagramCount = 0;
async function drawDiagram(code) {
  const mermaid = await mermaidReady;
  if (!(await mermaid.parse(code, { suppressErrors: true }))) return null;
  return (await mermaid.render(`diagram-${diagramCount++}`, code)).svg;
}

const renderedBlocks = new Map();
const lastDiagramAtPosition = [];
let previewMs = 0;

function swap(element, html, className) {
  const next = document.createRange().createContextualFragment(html).firstElementChild;
  Object.assign(next.dataset, element.dataset);
  if (className) next.classList.add(className);
  element.replaceWith(next);
  return next;
}

function renderPreview() {
  const prose = $("#prose");
  if (!prose) return;
  const started = performance.now();
  prose.innerHTML = String(processor.processSync(store.draft.body));
  previewMs = performance.now() - started;

  let diagramPosition = 0;
  for (const codeEl of prose.querySelectorAll("pre > code[class*='language-']")) {
    const lang = [...codeEl.classList].find((c) => c.startsWith("language-")).slice("language-".length);
    const code = codeEl.textContent.replace(/\n$/, "");
    const key = `${lang}\0${code}`;
    let target = codeEl.parentElement;
    if (renderedBlocks.has(key)) {
      if (lang === "mermaid") diagramPosition++;
      swap(target, renderedBlocks.get(key));
      continue;
    }
    if (lang !== "mermaid") {
      highlight(lang, code).then((html) => {
        if (!html) return;
        renderedBlocks.set(key, html);
        if (target.isConnected) swap(target, html);
      });
      continue;
    }
    // while a diagram is mid-edit the last good drawing stays, dimmed, instead of flashing back to source
    const position = diagramPosition++;
    if (lastDiagramAtPosition[position]) target = swap(target, lastDiagramAtPosition[position], "is-stale");
    drawDiagram(code).then((svg) => {
      if (!svg) return;
      const html = `<div class="mermaid-out">${svg}</div>`;
      renderedBlocks.set(key, html);
      lastDiagramAtPosition[position] = html;
      if (target.isConnected) swap(target, html);
    }).catch((error) => console.error("mermaid failed, source stays", error));
  }
  syncPreviewToSource();
}
let isPreviewQueued = false;
function queuePreview() {
  if (isPreviewQueued) return;
  isPreviewQueued = true;
  requestAnimationFrame(() => { isPreviewQueued = false; renderPreview(); renderBar(); });
}

function syncPreviewToSource() {
  const pane = $("#preview");
  if (!store.isScrollSynced || !sourceView || !pane) return;
  const scroller = sourceView.scrollDOM;
  if (scroller.scrollTop === 0) return void (pane.scrollTop = 0);
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) return void (pane.scrollTop = pane.scrollHeight);
  const topLine = sourceView.state.doc.lineAt(sourceView.lineBlockAtHeight(scroller.scrollTop).from).number;
  const blocks = [...pane.querySelectorAll("[data-line]")];
  const block = blocks.findLast((el) => Number(el.dataset.line) <= topLine) ?? blocks[0];
  if (!block) return;
  const start = Number(block.dataset.line);
  const end = Number(block.dataset.lineEnd);
  const progress = Math.min(1, (topLine - start) / (end - start + 1));
  const blockTop = block.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
  const breathingRoomPx = 24;
  pane.scrollTop = blockTop + block.offsetHeight * progress - breathingRoomPx;
}

  const field = e.target.dataset.field;
  if (!field) return;
  if (field === "topicsText") store.draft.topics = normaliseTopics(e.target.value.split(","));
  else store.draft[field] = e.target.value.replace(/\n/g, " ");
  if (field === "slug") store.isSlugTouched = true;
  if (field === "title" && store.draft.id === null && !store.isSlugTouched) {
    store.draft.slug = slugify(store.draft.title);
    $('[data-field="slug"]').value = store.draft.slug;
  }
  refresh();
});
app.addEventListener("keydown", (e) => {
  if (e.target.id === "topic-add" && (e.key === "Enter" || e.key === ",")) {
    e.preventDefault();
    setTopics([...store.draft.topics, e.target.value]);
    e.target.value = "";
  }
  if (e.key === "Enter" && e.target.matches(".head.editable textarea")) e.preventDefault();
});
app.addEventListener("change", (e) => {
  if (e.target.id === "topic-add" && e.target.value) {
    setTopics([...store.draft.topics, e.target.value]);
    e.target.value = "";
  }
  if (e.target.dataset.action === "pick") open(Number(e.target.value));
  if (e.target.dataset.field === "topicsText") setTopics(store.draft.topics);
});
app.addEventListener("submit", (e) => {
  e.preventDefault();
  const { title, slug, tagline } = Object.fromEntries(new FormData(e.target));
  const result = createArticle({ title: title.trim(), slug, tagline: tagline.trim() });
  if (!result.ok) return void ($('[data-slot="create-problem"]').textContent = SLUG_PROBLEMS[result.reason]);
  persist();
  open(result.article.id);
});
app.addEventListener("click", (e) => {
  const el = e.target.closest("button");
  if (!el) return;
  const { action, open: openId, removeTopic, toggleTopic, addTopic, layoutTo } = el.dataset;
  if (openId) open(Number(openId));
  if (removeTopic) setTopics(store.draft.topics.filter((t) => t !== removeTopic));
  if (toggleTopic) setTopics(store.draft.topics.includes(toggleTopic) ? store.draft.topics.filter((t) => t !== toggleTopic) : [...store.draft.topics, toggleTopic]);
  if (addTopic) setTopics([...store.draft.topics, addTopic]);
  if (layoutTo) {
    $(".panes").dataset.layout = layoutTo;
    for (const b of document.querySelectorAll("[data-layout-to]")) b.setAttribute("aria-pressed", b === el);
  }
  if (action === "save") save();
  if (action === "now") setPublishAt(toLocalInput(new Date()));
  if (action === "clear-date") setPublishAt("");
  if (action === "schedule") { const input = $('.drawer [data-field="publishAt"]'); input.focus(); input.showPicker(); }
  if (action === "drawer") $("#drawer").hidden = !$("#drawer").hidden;
  if (action === "close-dialog") $("#create").close();
  if (action === "list" && (!isDirty() || confirm("Discard unsaved changes?"))) { store.draft = null; store.isListShown = true; renderShell(); }
  if (action === "new") {
    if (variant === "A") return $("#create").showModal();
    if (isDirty() && !confirm("Discard unsaved changes?")) return;
    store.draft = blankDraft();
    store.isSlugTouched = false;
    renderShell();
  }
  if (action === "delete" && confirm(`Delete "${store.draft.title}"? This cannot be undone.`)) {
    store.articles = store.articles.filter((a) => a.id !== store.draft.id);
    store.draft = null;
    store.isListShown = true;
    renderShell();
  }
});
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    save();
  }
});

/* ---------- switcher ---------- */
const keys = Object.keys(VARIANTS);
const step = (d) => go({ variant: keys[(keys.indexOf(variant) + d + keys.length) % keys.length] });
function renderBar() {
  const readout = store.draft ? `${statusOf(store.draft.publishAt)} · ${isDirty() ? "unsaved" : "saved"} · ${store.draft.body.length.toLocaleString()} chars · preview ${previewMs.toFixed(1)} ms` : "no Article open";
  $("#bar").innerHTML = `<button data-step="-1" aria-label="Previous variant">←</button><span class="label">${variant} — ${VARIANTS[variant]}</span><button data-step="1" aria-label="Next variant">→</button>
    <span class="sep"></span><button data-bar="scheme">${scheme}</button><button data-bar="vim" aria-pressed="${store.isVim}">vim</button><button data-bar="sync" aria-pressed="${store.isScrollSynced}">scroll sync</button><button data-bar="reset">reset data</button>
    <span class="sep"></span><span class="readout">${readout}</span>`;
}
$("#bar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.step) return step(Number(b.dataset.step));
  if (b.dataset.bar === "scheme") return go({ scheme: SCHEMES[(SCHEMES.indexOf(scheme) + 1) % SCHEMES.length] });
  if (b.dataset.bar === "reset") { sessionStorage.removeItem(STORAGE_KEY); return location.reload(); }
  if (b.dataset.bar === "sync") store.isScrollSynced = !store.isScrollSynced;
  if (b.dataset.bar === "vim") { store.isVim = !store.isVim; persist(); return location.reload(); }
  refresh();
});
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

renderShell();
</script>
</body>
</html>
