<!doctype html>
<!-- PROTOTYPE, throwaway. Question: what does the Elemental Showdown Cover look like at Cover size,
     next to Sticky Notes and Blog on the Projects page? Four variants on ?variant=A|B|C|D.
     The Projects grid is a stand-in: the Blog Cover is the real SVG, the Sticky Notes one is approximated.
     Run: python3 -m http.server 8155 --directory prototype/cover -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: the Cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Newsreader:ital,wght@0,400;1,500&display=swap">
<style>
  @property --seam { syntax: "<percentage>"; inherits: true; initial-value: 50%; }
  :root { color-scheme: light dark; --ink: #14110f; --white: #ffffff; --paper: light-dark(#f7f7f4, #1a1b1a); --site-ink: light-dark(#202523, #e8e9e6); --line: light-dark(#dcddd8, #2e302e); --muted: light-dark(#626864, #9aa09c); }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--site-ink); font: 400 17px/1.5 "Newsreader", Georgia, serif; }

  /* the switcher: deliberately not part of the design */
  #bar { position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 10px; padding: 4px 8px; background: #000; color: #9f9; font: 12px/1.3 ui-monospace, monospace; }
  #bar button { font: inherit; font-size: 16px; color: inherit; border: 0; background: none; padding: 4px 12px; cursor: pointer; }
  #state { flex-basis: 100%; text-align: center; color: #aaa; }

  main { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h2 { font-size: 1.6rem; font-style: italic; font-weight: 500; margin-bottom: 1rem; }
  p.note { color: var(--muted); font-size: .9rem; margin: 2.5rem 0 .75rem; }
  ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.5rem 1.25rem; }
  .frame { position: relative; display: block; aspect-ratio: 3 / 2; }
  .frame > div { position: absolute; inset: 0; overflow: hidden; border-radius: 2px; border: 1px solid var(--line); transition: translate .2s, box-shadow .2s; }
  .frame:hover > div { translate: 0 -2px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); }
  .big { max-width: 45rem; }

  /* stand-in for the Sticky Notes Cover */
  .cork { width: 100%; height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 20% 30%, rgba(0,0,0,.05) 0 2px, transparent 3px) 0 0 / 14px 14px, radial-gradient(circle at 60% 70%, rgba(0,0,0,.06) 0 2px, transparent 3px) 0 0 / 22px 22px, linear-gradient(135deg, #c99a5b, #b07f3f); container-type: size; }
  .cork i { position: absolute; height: 70%; aspect-ratio: 1; box-shadow: 0 3px 8px rgb(0 0 0 / .3); }
  .cork .l { background: #f7a8c4; left: -22%; top: -8%; rotate: 6deg; }
  .cork .r { background: #9fd0f0; right: -22%; bottom: -10%; rotate: -5deg; }
  .cork b { position: relative; height: 85%; aspect-ratio: 1; display: grid; place-items: center; text-align: center; background: #fbe36a; rotate: -4deg; box-shadow: 0 4px 10px rgb(0 0 0 / .35); font: 700 10cqw/1.3 "Comic Sans MS", "Chalkboard SE", cursive; color: #111; }

  /* the Cover under test: everything sized in cqw so it scales with its frame, like the real Covers */
  .cover { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; color: var(--ink); font-family: "Bowlby One", sans-serif; line-height: .95; text-transform: lowercase; }
  .cover .emoji { position: absolute; translate: -50% -50%; line-height: 1; font-family: system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif; }

  /* A: the Tug in miniature. Two Elements, a tilted seam, the name on the pill. Hover: fire takes ground. */
  .tug { background: #2f7fe0; transition: --seam .35s cubic-bezier(.2, 1.3, .4, 1); }
  .frame:hover .tug { --seam: 62%; }
  .tug .fire { position: absolute; inset: 0; background: #f2541b; clip-path: polygon(0 0, calc(var(--seam) + 8%) 0, calc(var(--seam) - 8%) 100%, 0 100%); }
  .tug .seam { position: absolute; left: var(--seam); top: -20%; width: 2.4cqw; height: 140%; background: var(--ink); translate: -50%; rotate: 13.5deg; }
  .tug .emoji { font-size: 25cqw; }
  .tug .pill { position: absolute; left: var(--seam); top: 50%; translate: -50% -50%; rotate: -7deg; padding: 3cqw 5cqw 3.6cqw; border-radius: 5cqw; background: var(--ink); color: var(--white); font-size: 7.4cqw; text-align: center; white-space: nowrap; }

  /* B: title card. One Element colour, the name as big as the frame allows, the roster as a footer. */
  .title { background: #f7c600; }
  .title .words { position: absolute; left: 5cqw; top: 6cqw; font-size: 13.2cqw; letter-spacing: -.02em; }
  .title .strip { position: absolute; inset: auto 0 0 0; height: 17cqw; display: flex; align-items: center; justify-content: space-around; padding: 0 3cqw; background: var(--ink); font-size: 7cqw; font-family: system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }

  /* C: the mosaic. Every Element as a tile, the name stamped over it. */
  .mosaic { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(6, 1fr); background: var(--ink); }
  .mosaic span { display: grid; place-items: center; font-size: 6.4cqw; line-height: 1; font-family: system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .mosaic .stamp { position: absolute; left: 50%; top: 50%; translate: -50% -50%; rotate: -5deg; padding: 3cqw 5cqw 3.8cqw; background: var(--white); border: 1.4cqw solid var(--ink); border-radius: 3cqw; box-shadow: 1.4cqw 1.4cqw 0 var(--ink); font-size: 9.6cqw; text-align: center; white-space: nowrap; }

  /* D: the triangle. Three Elements that beat each other in a ring, the name in the middle. */
  .ring { background: conic-gradient(from 0deg, var(--ink) 0 1.4deg, #3f9d4a 1.4deg 118.6deg, var(--ink) 118.6deg 121.4deg, #2f7fe0 121.4deg 238.6deg, var(--ink) 238.6deg 241.4deg, #f2541b 241.4deg 358.6deg, var(--ink) 358.6deg); }
  .ring .emoji { font-size: 16cqw; }
  .ring .disc { position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 3cqw 5cqw 3.6cqw; border-radius: 5cqw; background: var(--ink); color: var(--white); font-size: 7cqw; white-space: nowrap; text-align: center; rotate: -6deg; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="bar">
  <button id="previous" aria-label="previous variant">‹</button>
  <span id="label"></span>
  <button id="following" aria-label="next variant">›</button>
  <span id="state"></span>
</div>
<main>
  <h2>Projects</h2>
  <ul>
    <li><a class="frame"><div><div class="cork"><i class="l"></i><i class="r"></i><b>STICKY<br>NOTES</b></div></div></a></li>
    <li><a class="frame"><div class="slot"></div></a></li>
    <li><a class="frame"><div>
      <svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">
        <rect width="300" height="200" fill="#ffffff"/>
        <text x="36" y="48" fill="#202523" font-family="Newsreader, Georgia, serif" font-size="34" font-style="italic" font-weight="500">Blog</text>
        <rect x="36" y="68" width="228" height="5.2" fill="#dcddd8"/><rect x="36" y="80" width="210" height="5.2" fill="#dcddd8"/><rect x="36" y="92" width="137" height="5.2" fill="#dcddd8"/>
        <rect x="36" y="104" width="178" height="26" fill="#f3e3d6"/><rect x="36" y="104" width="3.6" height="26" fill="#d96c1e"/>
        <rect x="36.5" y="137.5" width="227" height="31" fill="#f1f4f1" stroke="#dcddd8"/>
      </svg>
    </div></a></li>
  </ul>
  <p class="note">The same Cover, large, to judge the detail. Hover either one.</p>
  <a class="frame big"><div class="slot"></div></a>
</main>
<script>
  const ELEMENTS = [["🧪","#b4e31c"],["🌪️","#a9d6e8"],["🐺","#b5702a"],["🌑","#2b2440"],["🥊","#9c2b1e"],["🔥","#f2541b"],["😇","#f3d98b"],["❄️","#7fd8f0"],["💡","#fffbe0"],["⚡","#f7c600"],["🪄","#6a3df0"],["⚙️","#8d99a6"],["⚪","#c9c5b8"],["🌿","#3f9d4a"],["☠️","#8e3fb0"],["🧠","#f0509a"],["🪨","#8a7560"],["🏜️","#e3c58a"],["😈","#5b1a6e"],["💧","#2f7fe0"],["✴️","#b9a7ff"],["👽","#57e389"],["🐦","#58a6d6"],["🩸","#a3122a"],["🐛","#7a9b2a"],["🌀","#d01fd0"],["💎","#4fe0c0"],["🪦","#4a4a4a"],["🐉","#2a8f7f"],["🧚","#f7a8d8"],["🐟","#3aa6b9"],["🐸","#6cc24a"],["🍄","#c2543e"],["🪟","#d5eef2"],["🕳️","#1a1a22"],["🎭","#a05fd6"],["🧬","#ff6f91"],["🧲","#d23a3a"],["👹","#7d2e2e"],["⚖️","#e8e2d0"],["📄","#f4f1e6"],["☢️","#d6f03a"],["🦎","#4e8a3a"],["✂️","#c43c4f"],["🤖","#5f7d8c"],["🔊","#ff8a3d"],["🌌","#1d2a6b"],["♨️","#c9d3d8"],["⏳","#c9a96a"],["🧟","#6f8f6a"],["🦠","#6f7d3a"],["⚔️","#7a8088"]];
  const NAME = "elemental<br>showdown";

  // A fixed shuffle, so the mosaic's colours are scattered but the same on every load.
  const scattered = ELEMENTS.map((element, index) => [element, (index * 37) % 52]).sort((a, b) => a[1] - b[1]).map(([element]) => element);
  // 54 cells, 52 Elements: the two spare cells are the centre column of the middle rows, under the stamp.
  const tiles = [...scattered.slice(0, 22), null, ...scattered.slice(22, 30), null, ...scattered.slice(30)];

  const VARIANTS = {
    A: { name: "the Tug", html: `<div class="cover tug"><div class="fire"></div><div class="seam"></div><span class="emoji" style="left:19%;top:30%">🔥</span><span class="emoji" style="left:81%;top:70%">💧</span><div class="pill">${NAME}</div></div>` },
    B: { name: "title card", html: `<div class="cover title"><div class="words">${NAME}</div><div class="strip">${["🔥", "💧", "🌿", "⚡", "🪨", "❄️", "🐸", "✂️"].map((emoji) => `<span>${emoji}</span>`).join("")}</div></div>` },
    C: { name: "mosaic", html: `<div class="cover mosaic">${tiles.map((tile) => (tile ? `<span style="background:${tile[1]}">${tile[0]}</span>` : "<span></span>")).join("")}<div class="stamp">${NAME}</div></div>` },
    D: { name: "triangle", html: `<div class="cover ring"><span class="emoji" style="left:16%;top:27%">🔥</span><span class="emoji" style="left:84%;top:27%">🌿</span><span class="emoji" style="left:50%;top:84%">💧</span><div class="disc">${NAME}</div></div>` },
  };
  const keys = Object.keys(VARIANTS);

  function render() {
    const requested = new URLSearchParams(location.search).get("variant");
    const key = keys.includes(requested) ? requested : "A";
    for (const slot of document.querySelectorAll(".slot")) slot.innerHTML = VARIANTS[key].html;
    document.getElementById("label").textContent = `${key}: ${VARIANTS[key].name}`;
    const small = document.querySelector(".slot").getBoundingClientRect();
    document.getElementById("state").textContent = `cover in the grid: ${Math.round(small.width)} × ${Math.round(small.height)}px`;
    return key;
  }
  function cycle(step) {
    const next = keys[(keys.indexOf(render()) + step + keys.length) % keys.length];
    history.replaceState(null, "", `?variant=${next}`);
    render();
  }
  document.getElementById("previous").onclick = () => cycle(-1);
  document.getElementById("following").onclick = () => cycle(1);
  addEventListener("keydown", (event) => { if (event.key === "ArrowLeft") cycle(-1); if (event.key === "ArrowRight") cycle(1); });
  addEventListener("resize", render);
  render();
</script>
</body>
</html>
